<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#06b6d4" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.1" />
    </linearGradient>

    <!-- Text Gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Card / Squircle -->
  <rect 
    x="16" 
    y="16" 
    width="480" 
    height="480" 
    rx="120" 
    fill="url(#bgGrad)" 
    stroke="url(#borderGrad)" 
    stroke-width="12" 
  />

  <!-- Subtle Inner Glow Circle -->
  <circle cx="256" cy="256" r="180" fill="#3b82f6" opacity="0.12" filter="blur(40px)" />

  <!-- Monogram CT -->
  <text 
    x="50%" 
    y="54%" 
    text-anchor="middle" 
    dominant-baseline="central" 
    font-family="'Plus Jakarta Sans', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
    font-size="230" 
    font-weight="900" 
    letter-spacing="-10" 
    fill="url(#textGrad)"
  >CT</text>

  <!-- Accent dot / detail -->
  <circle cx="395" cy="355" r="18" fill="#06b6d4" filter="url(#glow)" />
</svg>
